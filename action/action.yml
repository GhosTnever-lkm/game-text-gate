name: GameText Gate
description: Offline static QA for game localization exports
author: GhosTnever
inputs:
  source:
    description: Source locale file path relative to the workspace
    required: true
  target:
    description: Target locale file path relative to the workspace
    required: true
  source-locale:
    description: Source locale identifier
    required: false
    default: en
  target-locale:
    description: Target locale identifier
    required: false
    default: ''
  format:
    description: auto, csv, po or json
    required: false
    default: auto
  source-column:
    description: Optional source CSV text column
    required: false
    default: ''
  target-column:
    description: Optional target CSV text column
    required: false
    default: ''
  report:
    description: text, markdown, json or sarif
    required: false
    default: markdown
  report-path:
    description: Optional report path relative to the workspace
    required: false
    default: ''
  fail-on:
    description: error or warning
    required: false
    default: error
  tool-version:
    description: Displayed tool version
    required: false
    default: '0.1.0'
  python-version:
    description: Python runtime version
    required: false
    default: '3.12'
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Run GameText Gate
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        GTT_SOURCE: ${{ inputs.source }}
        GTT_TARGET: ${{ inputs.target }}
        GTT_SOURCE_LOCALE: ${{ inputs.source-locale }}
        GTT_TARGET_LOCALE: ${{ inputs.target-locale }}
        GTT_FORMAT: ${{ inputs.format }}
        GTT_SOURCE_COLUMN: ${{ inputs.source-column }}
        GTT_TARGET_COLUMN: ${{ inputs.target-column }}
        GTT_REPORT: ${{ inputs.report }}
        GTT_REPORT_PATH: ${{ inputs.report-path }}
        GTT_FAIL_ON: ${{ inputs.fail-on }}
        GTT_VERSION: ${{ inputs.tool-version }}
      run: |
        python - <<'PY'
        import os
        import sys
        from pathlib import Path
        from game_text_gate.cli import main
        from game_text_gate.core import InputError, compare, load_entries
        from game_text_gate.report import make_report, to_json, to_markdown, to_sarif

        args = ["--source", os.environ["GTT_SOURCE"], "--target", os.environ["GTT_TARGET"],
                "--source-locale", os.environ["GTT_SOURCE_LOCALE"], "--format", os.environ["GTT_FORMAT"],
                "--report", os.environ["GTT_REPORT"], "--fail-on", os.environ["GTT_FAIL_ON"]]
        if os.environ["GTT_TARGET_LOCALE"]:
            args += ["--target-locale", os.environ["GTT_TARGET_LOCALE"]]
        if os.environ["GTT_SOURCE_COLUMN"]:
            args += ["--source-column", os.environ["GTT_SOURCE_COLUMN"]]
        if os.environ["GTT_TARGET_COLUMN"]:
            args += ["--target-column", os.environ["GTT_TARGET_COLUMN"]]
        if os.environ["GTT_REPORT_PATH"]:
            args += ["--output", os.environ["GTT_REPORT_PATH"]]
        result = main(args)
        if result in (0, 1):
            source = Path(os.environ["GTT_SOURCE"])
            target = Path(os.environ["GTT_TARGET"])
            fmt = os.environ["GTT_FORMAT"]
            if fmt == "auto":
                fmt = {".csv": "csv", ".po": "po", ".json": "json"}.get(source.suffix.casefold(), "")
            source_locale = os.environ["GTT_SOURCE_LOCALE"]
            target_locale = os.environ["GTT_TARGET_LOCALE"] or target.stem
            source_entries, source_findings = load_entries(source, fmt, source_locale, text_column=os.environ["GTT_SOURCE_COLUMN"] or None)
            target_entries, target_findings = load_entries(target, fmt, target_locale, text_column=os.environ["GTT_TARGET_COLUMN"] or None)
            findings = source_findings + target_findings + compare(source_entries, target_entries, source, target)
            for finding in findings:
                if finding.level not in ("error", "warning"):
                    continue
                level = "error" if finding.level == "error" else "warning"
                message = finding.message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                title = finding.rule_id.replace("%", "%25").replace(",", "%2C").replace(":", "%3A")
                props = f"file={finding.file.replace(',', '%2C')},title={title}"
                if finding.line:
                    props += f",line={finding.line}"
                print(f"::{level} {props}::{message}")
        sys.exit(result)
        PY
