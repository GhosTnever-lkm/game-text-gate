name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Build source archive and checksum
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=GameText-Gate-${GITHUB_REF_NAME}/ HEAD -o dist/GameText-Gate-${GITHUB_REF_NAME}.zip
          cd dist
          sha256sum GameText-Gate-${GITHUB_REF_NAME}.zip > GameText-Gate-${GITHUB_REF_NAME}.zip.sha256
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
