name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - name: CLI smoke test
        shell: bash
        run: |
          set +e
          PYTHONPATH=src python -m game_text_gate.cli --source samples/en.json --target samples/ru.json --report json --output report.json --fail-on error
          code=$?
          test "$code" -eq 1
          python -c "import json; r=json.load(open('report.json', encoding='utf-8')); assert r['summary']['error'] == 2 and r['summary']['warning'] == 2"
      - name: Exercise composite action from this checkout
        uses: ./
        with:
          source: samples/en.json
          target: samples/fr-clean.json
          source-locale: en
          target-locale: fr
          report: json
          report-path: action-report.json
      - name: Verify composite action report
        run: python -c "import json; r=json.load(open('action-report.json', encoding='utf-8')); assert not r['findings']"

