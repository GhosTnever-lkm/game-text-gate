name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - name: CLI smoke test
        shell: bash
        run: |
          set +e
          PYTHONPATH=src python -m game_text_gate.cli --source samples/en.json --target samples/ru.json --report json --output report.json --fail-on error
          code=$?
          test "$code" -eq 1
          python -c "import json; r=json.load(open('report.json', encoding='utf-8')); assert r['summary']['error'] == 2 and r['summary']['warning'] == 2"

